name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish to ACR (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: family-tree-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  IMAGE_REPOSITORY: registry.cn-shanghai.aliyuncs.com/wolfife/family

jobs:
  release:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a vX.Y.Z tag"; exit 1;
          }

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Verify package versions match tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const version = process.env.TAG_NAME.slice(1)
          if ([pkg.version, lock.version, lock.packages[''].version].some(value => value !== version)) {
            throw new Error('Tag, package.json and package-lock.json versions must match')
          }
          NODE

      - name: Check registry credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Set ACR_USERNAME and ACR_PASSWORD repository secrets"
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/family-registry-auth"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/family-registry-auth" >> "$GITHUB_ENV"

      - name: Test release
        run: |
          npm ci
          npm test
          bash -n scripts/deploy.sh
          bash -n scripts/install-schedule.sh
          bash -n scripts/publish-image.sh
          bash -n scripts/run-weekly.sh
          shellcheck scripts/deploy.sh scripts/install-schedule.sh scripts/publish-image.sh scripts/run-weekly.sh
          python3 -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' scripts/pull-release.py
          python3 -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' scripts/pull-image.py

      - name: Test subdirectory login flow
        run: |
          npx playwright install --with-deps webkit
          VITE_BASE_PATH=/family/ npm run test:browser -- tests/browser/passwordLogin.spec.ts --project=desktop

      - name: Build amd64 image for the subdirectory
        env:
          NODE_IMAGE: ${{ vars.FAMILY_NODE_IMAGE || 'node:22-bookworm-slim' }}
          NPM_REGISTRY: ${{ vars.FAMILY_NPM_REGISTRY || 'https://registry.npmjs.org' }}
        run: |
          docker build --platform linux/amd64 --build-arg APP_BASE_PATH=/family/ \
            --build-arg NODE_IMAGE="$NODE_IMAGE" --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${TAG_NAME#v}" \
            --label "org.family-tree.base-path=/family/" \
            --tag "family-tree:${TAG_NAME#v}" .

      - name: Check constrained runtime
        run: |
          export APP_IMAGE="family-tree:${TAG_NAME#v}"
          docker compose up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:3000/healthz
          curl --fail http://127.0.0.1:3000/login | grep '/family/assets/'

      - name: Check compressed image size
        run: |
          docker save "family-tree:${TAG_NAME#v}" | gzip > "$RUNNER_TEMP/family-tree-image.tar.gz"
          bytes=$(wc -c < "$RUNNER_TEMP/family-tree-image.tar.gz")
          echo "Compressed image: $bytes bytes"
          if [ "$bytes" -gt 125829120 ]; then
            echo "::error::Compressed runtime image exceeds 120 MiB"
            exit 1
          fi

      - name: Log in to Alibaba Cloud Container Registry
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$ACR_PASSWORD" |
            docker login "$REGISTRY" --username "$ACR_USERNAME" --password-stdin

      - name: Publish version and latest images without moving tags backwards
        run: bash scripts/publish-image.sh "${TAG_NAME#v}" "$IMAGE_REPOSITORY"
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --generate-notes
          fi

      - name: Log out of registry
        if: always()
        run: docker logout "$REGISTRY"

      - name: Collect logs and clean up test container
        if: always()
        run: |
          export APP_IMAGE="family-tree:${TAG_NAME#v}"
          docker compose logs --tail=80
          docker compose down --volumes
