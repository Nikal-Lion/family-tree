name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release and deploy (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: family-tree-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a vX.Y.Z tag"; exit 1;
          }

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Verify package versions match tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const version = process.env.TAG_NAME.slice(1)
          if ([pkg.version, lock.version, lock.packages[''].version].some(value => value !== version)) {
            throw new Error('Tag, package.json and package-lock.json versions must match')
          }
          NODE

      - name: Test release
        run: |
          npm ci
          npm test
          bash -n scripts/deploy.sh
          bash -n scripts/install-schedule.sh
          bash -n scripts/run-weekly.sh
          shellcheck scripts/deploy.sh scripts/install-schedule.sh scripts/run-weekly.sh
          python3 -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' scripts/pull-release.py

      - name: Test subdirectory login flow
        run: |
          npx playwright install --with-deps webkit
          VITE_BASE_PATH=/family/ npm run test:browser -- tests/browser/passwordLogin.spec.ts --project=desktop

      - name: Build amd64 image for the subdirectory
        env:
          NODE_IMAGE: ${{ vars.FAMILY_NODE_IMAGE || 'node:22-bookworm-slim' }}
          NPM_REGISTRY: ${{ vars.FAMILY_NPM_REGISTRY || 'https://registry.npmjs.org' }}
        run: |
          docker build --platform linux/amd64 --build-arg APP_BASE_PATH=/family/ \
            --build-arg NODE_IMAGE="$NODE_IMAGE" --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "family-tree:${TAG_NAME#v}" .

      - name: Check constrained runtime
        run: |
          export APP_IMAGE="family-tree:${TAG_NAME#v}"
          docker compose up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:3000/healthz
          curl --fail http://127.0.0.1:3000/login | grep '/family/assets/'

      - name: Prepare release bundle
        run: |
          mkdir -p bundle/scripts
          printf 'family-tree:%s\n' "${TAG_NAME#v}" > bundle/image.txt
          docker save "family-tree:${TAG_NAME#v}" | gzip > bundle/family-tree-image.tar.gz
          cp docker-compose.yml docker-compose.production.yml bundle/
          cp scripts/deploy.sh scripts/pull-release.py scripts/run-weekly.sh bundle/scripts/
          cd bundle
          sha256sum image.txt family-tree-image.tar.gz docker-compose.yml \
            docker-compose.production.yml scripts/deploy.sh scripts/pull-release.py \
            scripts/run-weekly.sh > SHA256SUMS
          tar -czf "../family-tree-${TAG_NAME}-linux-amd64.tar.gz" .
          bytes=$(wc -c < "../family-tree-${TAG_NAME}-linux-amd64.tar.gz")
          echo "Release bundle: $bytes bytes"
          if [ "$bytes" -gt 125829120 ]; then
            echo "::error::Release bundle exceeds 120 MiB"
            exit 1
          fi

      - name: Publish release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$TAG_NAME" "family-tree-${TAG_NAME}-linux-amd64.tar.gz" --clobber

      - name: Collect logs and clean up test container
        if: always()
        run: |
          export APP_IMAGE="family-tree:${TAG_NAME#v}"
          docker compose logs --tail=80
          docker compose down --volumes
