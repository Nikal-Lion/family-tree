name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  container:
    name: Build Docker image
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag family-tree:ci .

      - name: Check compressed image size
        run: |
          docker save family-tree:ci | gzip > "$RUNNER_TEMP/family-tree-image.tar.gz"
          bytes=$(wc -c < "$RUNNER_TEMP/family-tree-image.tar.gz")
          echo "Compressed image: $bytes bytes"
          if [ "$bytes" -gt 125829120 ]; then
            echo "::error::Compressed runtime image exceeds 120 MiB"
            exit 1
          fi

      - name: Verify constrained Compose runtime
        env:
          APP_IMAGE: family-tree:ci
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:3000/healthz
          curl --fail --output /dev/null http://127.0.0.1:3000/
          docker stats --no-stream

      - name: Collect container logs and clean up
        if: always()
        env:
          APP_IMAGE: family-tree:ci
        run: |
          docker compose logs --tail=100
          docker compose down --volumes
