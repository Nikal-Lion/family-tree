# Insert inside the existing HTTPS server block, not at http scope.
location = /family {
    return 308 /family/;
}

location ^~ /family/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $family_upstream family-tree-app:3000;
    rewrite ^/family/(.*)$ /$1 break;
    proxy_pass http://$family_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Override the parent site's no-cache header without hiding upstream cache policy.
    add_header X-Content-Type-Options nosniff always;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}
